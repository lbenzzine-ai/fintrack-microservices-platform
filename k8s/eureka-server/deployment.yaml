apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: 692101471621.dkr.ecr.us-east-1.amazonaws.com/fintrack-eureka-server:latest
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "512m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: fintrack
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
