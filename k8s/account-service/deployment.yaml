apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: 692101471621.dkr.ecr.us-east-1.amazonaws.com/fintrack-account-service:23252e15e260db78d01f61f4459685c59898e66f
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: fintrack-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintrack-secrets
                  key: db-password
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "512m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: fintrack
spec:
  selector:
    app: account-service
  ports:
    - port: 8082
      targetPort: 8082
