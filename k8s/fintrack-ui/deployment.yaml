apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintrack-ui
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fintrack-ui
  template:
    metadata:
      labels:
        app: fintrack-ui
    spec:
      containers:
        - name: fintrack-ui
          image: 692101471621.dkr.ecr.us-east-1.amazonaws.com/fintrack-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "128m"
              memory: "256Mi"
            limits:
              cpu: "256m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fintrack-ui
  namespace: fintrack
spec:
  selector:
    app: fintrack-ui
  ports:
    - port: 80
      targetPort: 80
