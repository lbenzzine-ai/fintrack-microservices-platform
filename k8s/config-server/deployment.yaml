apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: 692101471621.dkr.ecr.us-east-1.amazonaws.com/fintrack-config-server:59d1983f877ff923b67dde1060255035b3b785a2
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_SERVER_USER
              value: "configadmin"
            - name: CONFIG_SERVER_PASSWORD
              value: "configpass"
            - name: EUREKA_SERVER_URL
              value: "http://eureka-server:8761/eureka"
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "512m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: fintrack
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8080
      protocol: TCP
