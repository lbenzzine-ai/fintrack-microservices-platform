apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 692101471621.dkr.ecr.us-east-1.amazonaws.com/fintrack-api-gateway:23252e15e260db78d01f61f4459685c59898e66f
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fintrack-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fintrack-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "512m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fintrack
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer
