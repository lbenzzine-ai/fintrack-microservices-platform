apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 692101471621.dkr.ecr.us-east-1.amazonaws.com/fintrack-api-gateway:01f49c027d224fce2126fc826fc0b8f824a8dea6
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"
            - name: CONFIG_SERVER_USER
              value: "configadmin"
            - name: CONFIG_SERVER_PASSWORD
              value: "configpass"
            - name: EUREKA_SERVER_URL
              value: "http://eureka-server:8761/eureka"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fintrack-secrets
                  key: jwt-secret
            - name: ACTUATOR_USER
              value: "actuator"
            - name: ACTUATOR_PASSWORD
              value: "changeme"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "256m"
              memory: "768Mi"
            limits:
              cpu: "512m"
              memory: "1.5Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fintrack
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer
