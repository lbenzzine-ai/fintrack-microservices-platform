          </html>
          ROOTINDEX

      # ── Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          commit_message: "ci: update ${{ github.ref_name }} coverage reports [skip ci]"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5 — Docker build (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ build-java17, build-java21, quality-gate ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
        contents: read
        packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - notification-service
          - user-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (Java 21 — production image)
        working-directory: java21/${{ matrix.service }}
        run: mvn clean package -DskipTests --no-transfer-progress -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: java21/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 6 — Pipeline summary
  # ─────────────────────────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ build-java17, build-java21, quality-gate ]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## FinTrack CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Java 17 | ${{ needs.build-java17.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Java 21 | ${{ needs.build-java21.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate  | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Reports" >> $GITHUB_STEP_SUMMARY
          echo "📊 [All Reports](https://lbenzzine-ai.github.io/fintrack-microservices-platform/)" >> $GITHUB_STEP_SUMMARY
          echo "📈 [JaCoCo — ${{ github.ref_name }}](https://lbenzzine-ai.github.io/fintrack-microservices-platform/${{ github.ref_name }}/jacoco/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "🧬 [PIT Mutations — ${{ github.ref_name }}](https://lbenzzine-ai.github.io/fintrack-microservices-platform/${{ github.ref_name }}/pit/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
