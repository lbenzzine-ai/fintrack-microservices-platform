name: FinTrack CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fintrack

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # DETECT CHANGES — skip backend jobs on UI-only changes
  # ─────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'java17/**'
              - 'java21/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'fintrack-ui/**'

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Test Java 17 services (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  build-java17:
    name: Build & Test (Java 17) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - notification-service
          - user-service
          - api-gateway
          - config-server
          - eureka-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java17-${{ matrix.service }}-${{ hashFiles('java17/${{ matrix.service }}/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java17-${{ matrix.service }}-
            ${{ runner.os }}-maven-java17-

      - name: Build & Test ${{ matrix.service }}
        working-directory: java17/${{ matrix.service }}
        run: mvn clean verify --no-transfer-progress -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java17-${{ matrix.service }}
          path: java17/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Test Java 21 services (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  build-java21:
    name: Build & Test (Java 21) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - notification-service
          - user-service
          - api-gateway
          - config-server
          - eureka-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java21-${{ matrix.service }}-${{ hashFiles('java21/${{ matrix.service }}/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java21-${{ matrix.service }}-
            ${{ runner.os }}-maven-java21-

      - name: Build & Test ${{ matrix.service }}
        working-directory: java21/${{ matrix.service }}
        run: mvn clean verify --no-transfer-progress -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java21-${{ matrix.service }}
          path: java21/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Code quality gate
  # ─────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    needs: [ build-java17, build-java21 ]
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check for TODO / FIXME / HACK in production code
        run: |
          echo "Scanning for unresolved markers..."
          count=$(grep -r "TODO\|FIXME\|HACK" \
            --include="*.java" \
            --exclude-dir=test \
            java17/ java21/ | wc -l)
          echo "Found $count markers"
          if [ "$count" -gt "20" ]; then
            echo "::warning::$count TODO/FIXME markers found in production code"
          fi

      - name: Verify no System.out.println in production code
        run: |
          found=$(grep -r "System\.out\.println" \
            --include="*.java" \
            java17/transaction-service/src/main \
            java17/account-service/src/main \
            java17/notification-service/src/main \
            java17/user-service/src/main || true)
          if [ -n "$found" ]; then
            echo "::warning::System.out.println found — use SLF4J logger instead"
            echo "$found"
          fi
          echo "Quality check complete"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Coverage reports
  # ─────────────────────────────────────────────────────────────────────────
  coverage-reports:
    name: Coverage & Mutation Reports (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [ build-java17, build-java21, quality-gate ]
    if: github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-coverage-${{ github.ref_name }}-${{ hashFiles('java17/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-coverage-${{ github.ref_name }}-
            ${{ runner.os }}-maven-coverage-

      - name: Run tests + JaCoCo (Java 17)
        working-directory: java17
        run: mvn verify -T 1C --no-transfer-progress -B

      - name: Generate JaCoCo aggregate report
        working-directory: java17
        run: mvn jacoco:report-aggregate -pl coverage-report --no-transfer-progress -B

      - name: Run PIT mutation tests — api-gateway
        working-directory: java17/api-gateway
        timeout-minutes: 15
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — user-service
        working-directory: java17/user-service
        timeout-minutes: 15
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — account-service
        working-directory: java17/account-service
        timeout-minutes: 20
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — notification-service
        working-directory: java17/notification-service
        timeout-minutes: 20
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — transaction-service
        working-directory: java17/transaction-service
        timeout-minutes: 30
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Assemble + deploy coverage site
        run: |
          BRANCH=${{ github.ref_name }}
          mkdir -p gh-pages/$BRANCH/jacoco
          for svc in account-service transaction-service user-service notification-service api-gateway; do
            mkdir -p gh-pages/$BRANCH/jacoco/$svc
            mkdir -p gh-pages/$BRANCH/pit/$svc
            cp -r java17/$svc/target/site/jacoco/. gh-pages/$BRANCH/jacoco/$svc/ 2>/dev/null || true
            [ -d "java17/$svc/target/pit-reports" ] && cp -r java17/$svc/target/pit-reports/. gh-pages/$BRANCH/pit/$svc/ 2>/dev/null || true
          done
          cp -r java17/coverage-report/target/site/jacoco-aggregate/. gh-pages/$BRANCH/jacoco/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          commit_message: "ci: update ${{ github.ref_name }} coverage reports [skip ci]"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5 — Docker build (main branch only, backend changes only)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-java17, build-java21, quality-gate ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - notification-service
          - user-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (Java 21 — production image)
        working-directory: java21/${{ matrix.service }}
        run: mvn clean package -DskipTests --no-transfer-progress -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: java21/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 6 — Pipeline summary
  # ─────────────────────────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-java17, build-java21, quality-gate ]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## FinTrack CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend changed | ${{ needs.detect-changes.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend changed | ${{ needs.detect-changes.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Java 17 | ${{ needs.build-java17.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Java 21 | ${{ needs.build-java21.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate  | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
