name: FinTrack CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fintrack

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Test Java 17 services (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  build-java17:
    name: Build & Test (Java 17) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - notification-service
          - user-service
          - api-gateway
          - config-server
          - eureka-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java17-${{ matrix.service }}-${{ hashFiles('java17/${{ matrix.service }}/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java17-${{ matrix.service }}-
            ${{ runner.os }}-maven-java17-

      - name: Build & Test ${{ matrix.service }}
        working-directory: java17/${{ matrix.service }}
        run: mvn clean verify --no-transfer-progress -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java17-${{ matrix.service }}
          path: java17/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Test Java 21 services (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  build-java21:
    name: Build & Test (Java 21) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - notification-service
          - user-service
          - api-gateway
          - config-server
          - eureka-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java21-${{ matrix.service }}-${{ hashFiles('java21/${{ matrix.service }}/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java21-${{ matrix.service }}-
            ${{ runner.os }}-maven-java21-

      - name: Build & Test ${{ matrix.service }}
        working-directory: java21/${{ matrix.service }}
        run: mvn clean verify --no-transfer-progress -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java21-${{ matrix.service }}
          path: java21/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Code quality gate
  # ─────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    needs: [ build-java17, build-java21 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check for TODO / FIXME / HACK in production code
        run: |
          echo "Scanning for unresolved markers..."
          count=$(grep -r "TODO\|FIXME\|HACK" \
            --include="*.java" \
            --exclude-dir=test \
            java17/ java21/ | wc -l)
          echo "Found $count markers"
          if [ "$count" -gt "20" ]; then
            echo "::warning::$count TODO/FIXME markers found in production code"
          fi

      - name: Verify no System.out.println in production code
        run: |
          found=$(grep -r "System\.out\.println" \
            --include="*.java" \
            java17/transaction-service/src/main \
            java17/account-service/src/main \
            java17/notification-service/src/main \
            java17/user-service/src/main || true)
          if [ -n "$found" ]; then
            echo "::warning::System.out.println found — use SLF4J logger instead"
            echo "$found"
          fi
          echo "Quality check complete"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Coverage reports (both main AND dev branches)
  # Publishes to GitHub Pages under /main/ or /dev/ subfolder
  # ─────────────────────────────────────────────────────────────────────────
  coverage-reports:
    name: Coverage & Mutation Reports (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [ build-java17, build-java21, quality-gate ]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-coverage-${{ github.ref_name }}-${{ hashFiles('java17/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-coverage-${{ github.ref_name }}-
            ${{ runner.os }}-maven-coverage-

      # ── JaCoCo ────────────────────────────────────────────────────────
      - name: Run tests + JaCoCo (Java 17)
        working-directory: java17
        run: mvn verify -T 1C --no-transfer-progress -B

      - name: Generate JaCoCo aggregate report
        working-directory: java17
        run: mvn jacoco:report-aggregate -pl coverage-report --no-transfer-progress -B

      # ── PIT (per service, individual timeouts) ────────────────────────
      - name: Run PIT mutation tests — api-gateway
        working-directory: java17/api-gateway
        timeout-minutes: 15
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — user-service
        working-directory: java17/user-service
        timeout-minutes: 15
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — account-service
        working-directory: java17/account-service
        timeout-minutes: 20
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — notification-service
        working-directory: java17/notification-service
        timeout-minutes: 20
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      - name: Run PIT mutation tests — transaction-service
        working-directory: java17/transaction-service
        timeout-minutes: 30
        continue-on-error: true
        run: mvn org.pitest:pitest-maven:mutationCoverage --no-transfer-progress -B

      # ── Assemble site ─────────────────────────────────────────────────
      - name: Assemble coverage site

        run: |
          BRANCH=${{ github.ref_name }}
          mkdir -p gh-pages/$BRANCH/jacoco
          mkdir -p gh-pages/$BRANCH/pit/account-service
          mkdir -p gh-pages/$BRANCH/pit/transaction-service
          mkdir -p gh-pages/$BRANCH/pit/user-service
          mkdir -p gh-pages/$BRANCH/pit/notification-service
          mkdir -p gh-pages/$BRANCH/pit/api-gateway

          # JaCoCo aggregate
          cp -r java17/coverage-report/target/site/jacoco-aggregate/. \
            gh-pages/$BRANCH/jacoco/ 2>/dev/null || echo "JaCoCo aggregate not found"

          # JaCoCo per service — copy XML + HTML so the custom dashboard can fetch counters
          for svc in account-service transaction-service user-service notification-service api-gateway; do
            mkdir -p gh-pages/$BRANCH/jacoco/$svc
            cp -r java17/$svc/target/site/jacoco/. \
              gh-pages/$BRANCH/jacoco/$svc/ 2>/dev/null || true
          done

          # Custom JaCoCo dashboard (overwrites the empty maven-generated aggregate index)
          cat > gh-pages/$BRANCH/jacoco/index.html << 'JACOCODASHBOARD'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FinTrack — Line Coverage Dashboard</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; padding: 2rem; }
              .back { color: #58a6ff; text-decoration: none; font-size: 0.875rem; display: inline-block; margin-bottom: 1.5rem; }
              .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
              h1 { font-size: 1.5rem; }
              .sub { color: #8b949e; font-size: 0.875rem; margin-bottom: 2rem; }
              table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
              th { background: #21262d; padding: 0.75rem 1rem; text-align: left; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: #8b949e; }
              td { padding: 0.75rem 1rem; border-top: 1px solid #30363d; font-size: 0.875rem; }
              .bar-wrap { background: #30363d; border-radius: 99px; height: 6px; width: 100px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
              .bar { height: 100%; border-radius: 99px; }
              .score { font-weight: 600; }
              .total-row td { background: #21262d; font-weight: 600; border-top: 2px solid #30363d; }
              .timestamp { color: #8b949e; font-size: 0.75rem; margin-top: 1rem; }
              .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
              .tab { padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; font-size: 0.8125rem; transition: all .15s; }
              .tab.active { background: #1f6feb22; color: #58a6ff; border-color: #1f6feb44; }
              a { color: #58a6ff; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <a class="back" href="../">← Back to reports</a>
            <div class="header"><h1>Line Coverage Dashboard</h1></div>
            <p class="sub">JaCoCo coverage · Java 17 stack · Auto-generated by CI</p>
            <div class="tabs">
              <div class="tab active" onclick="showMetric('line')">Line Coverage</div>
              <div class="tab" onclick="showMetric('branch')">Branch Coverage</div>
              <div class="tab" onclick="showMetric('method')">Method Coverage</div>
              <div class="tab" onclick="showMetric('class')">Class Coverage</div>
            </div>
            <table>
              <thead>
                <tr><th>Service</th><th>Covered</th><th>Missed</th><th>Total</th><th>Score</th><th>Visual</th><th>Report</th></tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="7" style="text-align:center;color:#8b949e;padding:2rem">Loading...</td></tr>
              </tbody>
            </table>
            <p class="timestamp" id="ts"></p>
            <script>
              const services=['account-service','transaction-service','user-service','notification-service','api-gateway'];
              let currentMetric='line';
              let serviceData={};
              function color(p){return p>=80?'#3fb950':p>=60?'#d29922':'#f85149';}
              const metrics={line:'LINE',branch:'BRANCH',method:'METHOD',class:'CLASS'};
              async function loadAll(){
                for(const svc of services){
                  try{
                    const res=await fetch(svc+'/jacoco.xml');
                    if(!res.ok)throw new Error();
                    const text=await res.text();
                    const clean=text.replace(/<!DOCTYPE[^>]*>/i,'');
                    const xml=new DOMParser().parseFromString(clean,'text/xml');
                    const data={};
                    xml.querySelectorAll('report > counter').forEach(c=>{
                      data[c.getAttribute('type')]={covered:+c.getAttribute('covered'),missed:+c.getAttribute('missed')};
                    });
                    serviceData[svc]=data;
                  }catch(e){serviceData[svc]=null;}
                }
                render();
                document.getElementById('ts').textContent='Generated: '+new Date().toUTCString();
              }
              function render(){
                const type=metrics[currentMetric];
                const tbody=document.getElementById('tbody');
                tbody.innerHTML='';
                let tc=0,tm=0;
                for(const svc of services){
                  const d=serviceData[svc];
                  if(!d||!d[type]){
                    tbody.innerHTML+='<tr><td>'+svc+'</td><td colspan="6" style="color:#8b949e">Report not available</td></tr>';
                    continue;
                  }
                  const covered=d[type].covered,missed=d[type].missed,total=covered+missed;
                  const pct=total>0?Math.round(covered/total*100):0;
                  tc+=covered;tm+=missed;
                  const c=color(pct);
                  tbody.innerHTML+='<tr><td>'+svc+'</td><td>'+covered+'</td><td>'+missed+'</td><td>'+total+'</td>'+
                    '<td class="score" style="color:'+c+'">'+pct+'%</td>'+
                    '<td><div class="bar-wrap"><div class="bar" style="width:'+pct+'%;background:'+c+'"></div></div></td>'+
                    '<td><a href="'+svc+'/index.html">View →</a></td></tr>';
                }
                const tt=tc+tm,tp=tt>0?Math.round(tc/tt*100):0,c=color(tp);
                tbody.innerHTML+='<tr class="total-row"><td>TOTAL</td><td>'+tc+'</td><td>'+tm+'</td><td>'+tt+'</td>'+
                  '<td class="score" style="color:'+c+'">'+tp+'%</td>'+
                  '<td><div class="bar-wrap"><div class="bar" style="width:'+tp+'%;background:'+c+'"></div></div></td><td></td></tr>';
              }
              function showMetric(m){
                currentMetric=m;
                document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['line','branch','method','class'][i]===m));
                render();
              }
              loadAll();
            </script>
          </body>
          </html>
          JACOCODASHBOARD

          # PIT per service — copy both HTML and XML
          for svc in account-service transaction-service user-service notification-service api-gateway; do
            echo "=== PIT debug: $svc ==="
            ls java17/$svc/target/pit-reports/ 2>&1 || echo "no pit-reports folder"
            latest=$(ls java17/$svc/target/pit-reports/ 2>/dev/null | tail -1)
            if [ -n "$latest" ]; then
              cp -r java17/$svc/target/pit-reports/$latest/. \
                gh-pages/$BRANCH/pit/$svc/ 2>/dev/null || true
              # Also copy XML to pit root for dashboard to read
              cp java17/$svc/target/pit-reports/$latest/mutations.xml \
                gh-pages/$BRANCH/pit/$svc/mutations.xml 2>/dev/null || true
            fi
          done

      # ── PIT aggregate dashboard ────────────────────────────────────────
      - name: Generate PIT aggregate dashboard
        run: |
          BRANCH=${{ github.ref_name }}
          BADGE_COLOR=$([ "$BRANCH" = "main" ] && echo "238636" || echo "1f6feb")
          cat > gh-pages/$BRANCH/pit/index.html << DASHBOARD
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FinTrack — Mutation Coverage · ${BRANCH}</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; padding: 2rem; }
              .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
              h1 { font-size: 1.5rem; }
              .branch { background: #${BADGE_COLOR}22; color: #${BADGE_COLOR}; border: 1px solid #${BADGE_COLOR}44; border-radius: 99px; padding: 2px 12px; font-size: 0.75rem; font-weight: 600; }
              .sub { color: #8b949e; font-size: 0.875rem; margin-bottom: 2rem; }
              .back { color: #58a6ff; text-decoration: none; font-size: 0.875rem; display: inline-block; margin-bottom: 1.5rem; }
              table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; }
              th { background: #21262d; padding: 0.75rem 1rem; text-align: left; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: #8b949e; }
              td { padding: 0.75rem 1rem; border-top: 1px solid #30363d; font-size: 0.875rem; }
              .bar-wrap { background: #30363d; border-radius: 99px; height: 6px; width: 120px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
              .bar { height: 100%; border-radius: 99px; }
              .score { font-weight: 600; }
              a { color: #58a6ff; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .total-row td { background: #21262d; font-weight: 600; border-top: 2px solid #30363d; }
              .timestamp { color: #8b949e; font-size: 0.75rem; margin-top: 1rem; }
            </style>
          </head>
          <body>
          <a class="back" href="../">← Back to reports</a>
          <div class="header">
            <h1>Mutation Coverage Dashboard</h1>
            <span class="branch">${BRANCH}</span>
          </div>
          <p class="sub">PIT mutation testing · Java 17 stack · Auto-generated by CI</p>
          <table>
            <thead>
              <tr>
                <th>Service</th>
                <th>Mutations</th>
                <th>Killed</th>
                <th>Survived</th>
                <th>Score</th>
                <th>Visual</th>
                <th>Report</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="7" style="text-align:center;color:#8b949e;padding:2rem">Loading mutation data...</td></tr>
            </tbody>
          </table>
          <p class="timestamp" id="ts"></p>
          <script>
          const services = ['account-service','transaction-service','user-service','notification-service','api-gateway'];

          function color(score) {
            return score >= 75 ? '#3fb950' : score >= 50 ? '#d29922' : '#f85149';
          }

          async function loadData() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            let totalMutations = 0, totalKilled = 0;

            for (const svc of services) {
              try {
                const res = await fetch(svc + '/mutations.xml');
                if (!res.ok) throw new Error('not found');
                const text = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const mutations = xml.querySelectorAll('mutation');
                const total = mutations.length;
                const killed = [...mutations].filter(m => m.getAttribute('status') === 'KILLED').length;
                const survived = total - killed;
                const score = total > 0 ? Math.round((killed / total) * 100) : 0;
                totalMutations += total;
                totalKilled += killed;
                const c = color(score);
                const tr = document.createElement('tr');
                tr.innerHTML = '<td>' + svc + '</td>' +
                  '<td>' + total + '</td>' +
                  '<td>' + killed + '</td>' +
                  '<td>' + survived + '</td>' +
                  '<td class="score" style="color:' + c + '">' + score + '%</td>' +
                  '<td><div class="bar-wrap"><div class="bar" style="width:' + score + '%;background:' + c + '"></div></div></td>' +
                  '<td><a href="' + svc + '/index.html">View →</a></td>';
                tbody.appendChild(tr);
              } catch(e) {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td>' + svc + '</td><td colspan="6" style="color:#8b949e">Report not available</td>';
                tbody.appendChild(tr);
              }
            }

            const totalScore = totalMutations > 0 ? Math.round((totalKilled / totalMutations) * 100) : 0;
            const c = color(totalScore);
            const totalRow = document.createElement('tr');
            totalRow.className = 'total-row';
            totalRow.innerHTML = '<td>TOTAL</td>' +
              '<td>' + totalMutations + '</td>' +
              '<td>' + totalKilled + '</td>' +
              '<td>' + (totalMutations - totalKilled) + '</td>' +
              '<td class="score" style="color:' + c + '">' + totalScore + '%</td>' +
              '<td><div class="bar-wrap"><div class="bar" style="width:' + totalScore + '%;background:' + c + '"></div></div></td>' +
              '<td></td>';
            tbody.appendChild(totalRow);

            document.getElementById('ts').textContent = 'Generated: ' + new Date().toUTCString();
          }

          loadData();
          </script>
          </body>
          </html>
          DASHBOARD

      # ── Branch index page ──────────────────────────────────────────────
      - name: Generate branch index page
        run: |
          BRANCH=${{ github.ref_name }}
          BADGE_COLOR=$([ "$BRANCH" = "main" ] && echo "238636" || echo "1f6feb")
          cat > gh-pages/$BRANCH/index.html << BRANCHINDEX
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>FinTrack — Quality Reports · ${BRANCH}</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; padding: 3rem; }
              .back { color: #58a6ff; text-decoration: none; font-size: 0.875rem; display: inline-block; margin-bottom: 1.5rem; }
              .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
              h1 { font-size: 1.75rem; }
              .branch { background: #${BADGE_COLOR}22; color: #${BADGE_COLOR}; border: 1px solid #${BADGE_COLOR}44; border-radius: 99px; padding: 2px 12px; font-size: 0.875rem; font-weight: 600; }
              .sub { color: #8b949e; margin-bottom: 2.5rem; font-size: 0.875rem; }
              .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
              .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem; transition: border-color .2s; }
              .card:hover { border-color: #58a6ff; }
              .card h2 { font-size: 1rem; margin-bottom: 0.5rem; }
              .card p { color: #8b949e; font-size: 0.8125rem; line-height: 1.6; margin-bottom: 1rem; }
              .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.8125rem; font-weight: 500; }
              .btn-green { background: #238636; color: white; }
              .btn-blue { background: #1f6feb; color: white; }
              .btn:hover { opacity: 0.85; }
            </style>
          </head>
          <body>
            <a class="back" href="../">← All branches</a>
            <div class="header">
              <h1>Quality Reports</h1>
              <span class="branch">${BRANCH}</span>
            </div>
            <p class="sub">Auto-generated on every push · Java 17 stack</p>
            <div class="cards">
              <div class="card">
                <h2>📊 JaCoCo Line Coverage</h2>
                <p>Aggregate line and branch coverage across all business services. Excludes infrastructure, DTOs, entities, and aspects.</p>
                <a href="jacoco/index.html" class="btn btn-blue">View Coverage →</a>
              </div>
              <div class="card">
                <h2>🧬 PIT Mutation Testing</h2>
                <p>Mutation scores per service showing whether tests actually catch bugs — not just execute lines of code.</p>
                <a href="pit/index.html" class="btn btn-green">View Mutations →</a>
              </div>
            </div>
          </body>
          </html>
          BRANCHINDEX

      # ── Root landing page (lists all branches) ─────────────────────────
      - name: Generate root landing page
        run: |
          cat > gh-pages/index.html << 'ROOTINDEX'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>FinTrack — Quality Reports</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; padding: 3rem; max-width: 800px; margin: 0 auto; }
              h1 { font-size: 2rem; margin-bottom: 0.25rem; }
              .sub { color: #8b949e; margin-bottom: 3rem; }
              .branch-section { margin-bottom: 2rem; }
              .branch-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
              .badge { border-radius: 99px; padding: 2px 10px; font-size: 0.75rem; font-weight: 600; }
              .badge-main { background: #23863622; color: #3fb950; border: 1px solid #23863644; }
              .badge-dev { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb44; }
              .links { display: flex; gap: 1rem; flex-wrap: wrap; }
              .link-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.875rem 1.25rem; text-decoration: none; color: #e6edf3; transition: border-color .2s; min-width: 180px; }
              .link-card:hover { border-color: #58a6ff; }
              .link-card .icon { font-size: 1.25rem; margin-bottom: 4px; }
              .link-card .name { font-size: 0.875rem; font-weight: 500; }
              .link-card .desc { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
              .divider { border: none; border-top: 1px solid #30363d; margin: 2rem 0; }
              .repo-link { color: #58a6ff; text-decoration: none; font-size: 0.875rem; }
            </style>
          </head>
          <body>
            <h1>FinTrack</h1>
            <p class="sub">Quality reports — auto-generated by CI on every push</p>

            <div class="branch-section">
              <div class="branch-title">
                <span class="badge badge-main">main</span>
                Production branch
              </div>
              <div class="links">
                <a href="main/" class="link-card">
                  <div class="icon">📊</div>
                  <div class="name">All Reports</div>
                  <div class="desc">JaCoCo + PIT</div>
                </a>
                <a href="main/jacoco/index.html" class="link-card">
                  <div class="icon">📈</div>
                  <div class="name">Line Coverage</div>
                  <div class="desc">JaCoCo aggregate</div>
                </a>
                <a href="main/pit/index.html" class="link-card">
                  <div class="icon">🧬</div>
