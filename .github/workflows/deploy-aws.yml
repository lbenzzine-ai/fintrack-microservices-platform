name: Build & Deploy to AWS EKS

on:
  push:
    branches: [main, dev]
    paths:
      - 'java21/**'
      - 'k8s/**'
      - '.github/workflows/deploy-aws.yml'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: fintrack-cluster

jobs:
  # ── Job 1: Build and push Docker images ──────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - account-service
          - transaction-service
          - notification-service
          - config-server
          - eureka-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: |
          cd java21/${{ matrix.service }}
          mvn clean package -DskipTests -q
          echo "✅ JAR built for ${{ matrix.service }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/fintrack-${{ matrix.service }}:latest
          SHA_IMAGE=${{ env.ECR_REGISTRY }}/fintrack-${{ matrix.service }}:${{ github.sha }}

          docker build -t $IMAGE -t $SHA_IMAGE java21/${{ matrix.service }}/
          docker push $IMAGE
          docker push $SHA_IMAGE
          echo "✅ ${{ matrix.service }} pushed to ECR"

      - name: Update K8s manifest with new image tag
        run: |
          sed -i "s|fintrack-${{ matrix.service }}:latest|fintrack-${{ matrix.service }}:${{ github.sha }}|g" \
            k8s/${{ matrix.service }}/deployment.yaml
          echo "✅ Updated image tag in k8s manifest"

  # ── Job 2: Commit updated manifests ──────────────────────────────
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update all manifests with SHA tag
        run: |
          for service in api-gateway user-service account-service transaction-service notification-service config-server eureka-server; do
            sed -i "s|fintrack-$service:latest|fintrack-$service:${{ github.sha }}|g" \
              k8s/$service/deployment.yaml
          done

      - name: Commit and push updated manifests
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push

  # ── Job 3: Deploy secrets to K8s ─────────────────────────────────
  deploy-secrets:
    name: Deploy Secrets to EKS
    runs-on: ubuntu-latest
    needs: update-manifests

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Deploy secrets from AWS Secrets Manager to K8s
        run: |
          JWT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id fintrack/jwt-secret \
            --query SecretString --output text)

          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id fintrack/db/user-service/password \
            --query SecretString --output text)

          kubectl create secret generic fintrack-secrets \
            --namespace fintrack \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=db-password="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✅ Secrets deployed to EKS"

  # ── Job 4: ArgoCD sync ────────────────────────────────────────────
  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: deploy-secrets

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Port forward ArgoCD
        run: |
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          sleep 10

      - name: Get ArgoCD password
        run: |
          ARGOCD_PASSWORD=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd \
            -o jsonpath="{.data.password}" | base64 -d)
          echo "ARGOCD_PASSWORD=$ARGOCD_PASSWORD" >> $GITHUB_ENV

      - name: Sync ArgoCD application
        run: |
          argocd login localhost:8080 \
            --username admin \
            --password ${{ env.ARGOCD_PASSWORD }} \
            --insecure

          argocd app sync fintrack --insecure
          argocd app wait fintrack --health --insecure --timeout 300

          echo "✅ ArgoCD sync complete"

  # ── Job 5: Health check ───────────────────────────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: argocd-sync

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Check all pods running
        run: |
          echo "Waiting for pods..."
          kubectl wait --for=condition=ready pod \
            --all -n fintrack \
            --timeout=300s

          echo "✅ All pods healthy"
          kubectl get pods -n fintrack
