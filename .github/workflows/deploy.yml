name: Build & Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  # ── Job 1: Build Java 21 ─────────────────────────────────────────────────────
  build-java:
    name: Build Java 21 Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build all Java 21 services
        run: |
          cd java21
          mvn package -DskipTests -q
          echo "✅ Java 21 build complete"

      - name: Upload JARs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: java21-jars
          path: java21/**/target/*.jar
          retention-days: 1

  # ── Job 2: Build Angular UI ──────────────────────────────────────────────────
  build-angular:
    name: Build Angular UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fintrack-ui/package-lock.json

      - name: Create production environment file
        run: |
          mkdir -p fintrack-ui/src/environments
          cat > fintrack-ui/src/environments/environment.prod.ts << 'ENVEOF'
          export const environment = {
            production: true,
            apiUrl: 'https://fintrack.ddns.net',
            services: {
              swagger: 'http://${{ secrets.ORACLE_HOST }}:8080/swagger-ui.html',
              grafana: 'http://${{ secrets.ORACLE_HOST }}:3000',
              zipkin: 'http://${{ secrets.ORACLE_HOST }}:9411',
              eureka: 'http://${{ secrets.ORACLE_HOST }}:8761',
              kafdrop: 'http://${{ secrets.ORACLE_HOST }}:8090',
              kibana: 'http://${{ secrets.ORACLE_HOST }}:5601',
              elasticsearch: 'http://${{ secrets.ORACLE_HOST }}:9200',
              mailhog: 'http://${{ secrets.ORACLE_HOST }}:8025',
            }
          };
          ENVEOF

      - name: Install dependencies
        run: |
          cd fintrack-ui
          npm ci

      - name: Build Angular for production
        run: |
          cd fintrack-ui
          npm run build:prod
          echo "✅ Angular build complete"

      - name: Upload Angular dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: fintrack-ui/dist/fintrack-ui/
          retention-days: 1

  # ── Job 3: Deploy (only on push to main) ─────────────────────────────────────
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: [build-java, build-angular]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Download Angular dist
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: angular-dist/

      - name: Deploy Java services to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "📦 Pulling latest code..."
            cd /home/ubuntu/fintrack
            git fetch origin
            git checkout main
            git pull origin main

            echo "🔨 Building Java 21 services..."
            cd java21
            mvn package -DskipTests -q
            cd ..

            echo "🐳 Restarting Docker services..."
            docker compose down
            docker compose build --no-cache account-service transaction-service user-service notification-service
            docker compose up -d

            echo "⏳ Waiting for services to be healthy..."
            sleep 120
            
            echo "🗑️ Flushing Redis stale cache..."
            docker exec fintrack-redis redis-cli FLUSHALL

            echo "✅ Service status:"
            docker compose ps --format "table {{.Name}}\t{{.Status}}"

            echo "🧹 Preparing Nginx folder..."
            sudo rm -rf /var/www/fintrack
            sudo mkdir -p /var/www/fintrack
            sudo chown ubuntu:ubuntu /var/www/fintrack

      - name: Copy Angular files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "angular-dist/*"
          target: "/var/www/fintrack"
          strip_components: 1
          rm: false

      - name: Fix permissions and reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/fintrack
            sudo chmod -R 755 /var/www/fintrack
            sudo systemctl reload nginx
            echo "✅ Nginx reloaded"
            echo "🌐 FinTrack is live at https://fintrack.ddns.net"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sleep 30
            STATUS=$(curl -s http://localhost:8080/actuator/health | python3 -m json.tool | grep '"status"' | head -1)
            echo "Gateway health: $STATUS"
