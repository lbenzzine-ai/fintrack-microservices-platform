global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: fintrack

scrape_configs:
  # FinTrack microservices — Spring Boot Actuator's /actuator/prometheus endpoint.
  # Targets use host.docker.internal so Prometheus (in docker) can reach services
  # whether they run on the host (make run-17/21) or in docker-compose (ports exposed to host).
  - job_name: "config-server"
    metrics_path: /actuator/prometheus
    basic_auth:
      username: configadmin
      password: configpass
    static_configs:
      - targets: ["host.docker.internal:8889"]
        labels:
          service: "config-server"

  - job_name: "eureka-server"
    metrics_path: /actuator/prometheus
    basic_auth:
      username: eurekaadmin
      password: eurekapass
    static_configs:
      - targets: ["host.docker.internal:8761"]
        labels:
          service: "eureka-server"

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "api-gateway"

  - job_name: "user-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: "user-service"

  - job_name: "account-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          service: "account-service"

  - job_name: "transaction-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          service: "transaction-service"

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels:
          service: "notification-service"

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
