# Most config comes from Config Server (account-service.yml + application.yml).
# This file is the minimal fallback used when running without Config Server.

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: account-service
  flyway:
    connect-retries: 20
    connect-retries-interval: 5

info:
  app:
    name: ${spring.application.name}
    description: FinTrack Account Service (Saga participant, EHCache L2, Strategy interest)
    java-version: 17
