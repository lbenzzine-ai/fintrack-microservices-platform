server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_TRANSACTIONS_HOST:localhost}:${MYSQL_TRANSACTIONS_PORT:3309}/fintrack_transactions?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
    username: ${MYSQL_TRANSACTIONS_USER}
    password: ${MYSQL_TRANSACTIONS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      idle-timeout: 600000
      keepalive-time: 60000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-init-sql: SELECT 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.batch_size: 200
        order_inserts: true
        order_updates: true
        cache.use_second_level_cache: true
        cache.use_query_cache: true
        cache.region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        javax.cache.provider: org.ehcache.jsr107.EhcacheCachingProvider
        javax.cache.uri: classpath:ehcache.xml
        generate_statistics: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 120000

  kafka:
    producer:
      properties:
        spring.json.type.mapping: "transactionInitiatedEvent:com.fintrack.transaction.event.TransactionInitiatedEvent,transactionCompletedEvent:com.fintrack.transaction.event.TransactionCompletedEvent,transactionFailedEvent:com.fintrack.transaction.event.TransactionFailedEvent,notificationRequestedEvent:com.fintrack.transaction.event.NotificationRequestedEvent,accountDebitedEvent:com.fintrack.transaction.event.AccountDebitedEvent"
    consumer:
      properties:
        spring.json.type.mapping: "transactionInitiatedEvent:com.fintrack.transaction.event.TransactionInitiatedEvent,transactionCompletedEvent:com.fintrack.transaction.event.TransactionCompletedEvent,transactionFailedEvent:com.fintrack.transaction.event.TransactionFailedEvent,notificationRequestedEvent:com.fintrack.transaction.event.NotificationRequestedEvent,accountDebitedEvent:com.fintrack.transaction.event.AccountDebitedEvent"

fintrack:
  transaction:
    seed:
      enabled: ${TX_SEED_ENABLED:true}
      count: ${TX_SEED_COUNT:100000}
      batch-size: 1000
    fee:
      # Strategy pattern: flat | percentage | tiered | crypto
      default-strategy: ${TX_FEE_STRATEGY:tiered}
      flat-amount: 1.50
      percentage-rate: 0.015
      tiered:
        - { upTo: 100,    fee: 0.50 }
        - { upTo: 1000,   fee: 2.00 }
        - { upTo: 10000,  fee: 10.00 }
        - { upTo: 9.9E18, fee: 25.00 }
      crypto-rate: 0.001
    saga:
      timeout-seconds: 30
      max-compensations: 3
    cache:
      tx-by-id: transactions:byId
      tx-by-account: transactions:byAccount
      ttl-seconds: 120

resilience4j:
  circuitbreaker:
    instances:
      accountServiceClient:
        base-config: default
        failure-rate-threshold: 40
      userServiceClient:
        base-config: default
  retry:
    instances:
      accountServiceClient:
        base-config: default
      userServiceClient:
        base-config: default
  timelimiter:
    instances:
      accountServiceClient:
        base-config: default
