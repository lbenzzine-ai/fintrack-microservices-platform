server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_USERS_HOST:localhost}:${MYSQL_USERS_PORT:3307}/fintrack_users?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USERS_USER}
    password: ${MYSQL_USERS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: UsersHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        # L1 cache is enabled per Session by default — nothing to configure
        cache.use_second_level_cache: false
        cache.use_query_cache: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  kafka:
    producer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.user.event.UserRegisteredEvent"
    consumer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.user.event.UserRegisteredEvent"

fintrack:
  user:
    password-encoder-strength: 12
    cache:
      users-by-id: users:byId
      users-by-email: users:byEmail
      ttl-seconds: 600
