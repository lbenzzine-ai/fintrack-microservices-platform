server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_NOTIFICATIONS_HOST:localhost}:${MYSQL_NOTIFICATIONS_PORT:3310}/fintrack_notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_NOTIFICATIONS_USER:fintrack}
    password: ${MYSQL_NOTIFICATIONS_PASSWORD:fintrack}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      pool-name: NotificationsHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: fintrack-async-

fintrack:
  notification:
    # Strategy pattern: enabled channels for each event type
    channels:
      default: [EMAIL]
      user-registered: [EMAIL]
      transaction-completed: [EMAIL, PUSH]
      transaction-failed: [EMAIL, SMS, PUSH]
      account-debited: [PUSH]
    email:
      from: noreply@fintrack.io
      templates-path: classpath:/templates/email/
    sms:
      provider: ${SMS_PROVIDER:mock}   # mock | twilio
      twilio:
        account-sid: ${TWILIO_SID:}
        auth-token: ${TWILIO_TOKEN:}
        from-number: ${TWILIO_FROM:+10000000000}
    push:
      provider: ${PUSH_PROVIDER:mock}  # mock | fcm
      fcm-key: ${FCM_KEY:}
    slack:
      webhook-url: ${SLACK_WEBHOOK:}
