# Pipeline for FinTrack JSON logs. Each service ships logstash-encoded JSON over TCP/5044 (from
# logback-spring.xml). We index regular app logs and AUDIT logs separately so Kibana can build
# a dedicated audit dashboard.

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [stream] == "audit" {
    mutate { add_tag => ["audit"] }
  }
  date {
    match => ["@timestamp", "ISO8601"]
  }
}

output {
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "fintrack-audit-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "fintrack-logs-%{+YYYY.MM.dd}"
    }
  }
}
