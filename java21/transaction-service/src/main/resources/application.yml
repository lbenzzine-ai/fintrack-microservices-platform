# Most config comes from Config Server (transaction-service.yml + application.yml).
# This file is the minimal fallback used when running without Config Server.

server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: transaction-service
  flyway:
    connect-retries: 20
    connect-retries-interval: 5

info:
  app:
    name: ${spring.application.name}
    description: FinTrack Transaction Service (Saga orchestrator, Strategy fees — Java 21)
    java-version: 21
    features: virtual-threads,records,sealed-strategy,pattern-matching
