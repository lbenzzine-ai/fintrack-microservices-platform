server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      idle-timeout: 60000
      pool-name: UsersHikariPool
      initialization-fail-timeout: 120000
      connection-timeout: 30000
      connection-init-sql: SELECT 1
      keepalive-time: 60000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 50
        order_inserts: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 20
    connect-retries-interval: 5

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: fintrack-async-

  kafka:
    producer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.notification.event.UserRegisteredEvent,accountCreatedEvent:com.fintrack.notification.event.AccountCreatedEvent,transactionCompletedEvent:com.fintrack.notification.event.TransactionCompletedEvent,transactionFailedEvent:com.fintrack.notification.event.TransactionFailedEvent,notificationRequestedEvent:com.fintrack.notification.event.NotificationRequestedEvent"
    consumer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.notification.event.UserRegisteredEvent,accountCreatedEvent:com.fintrack.notification.event.AccountCreatedEvent,transactionCompletedEvent:com.fintrack.notification.event.TransactionCompletedEvent,transactionFailedEvent:com.fintrack.notification.event.TransactionFailedEvent,notificationRequestedEvent:com.fintrack.notification.event.NotificationRequestedEvent"

fintrack:
  notification:
    # Strategy pattern: enabled channels for each event type
    channels:
      default: [EMAIL]
      user-registered: [EMAIL]
      transaction-completed: [EMAIL, PUSH]
      transaction-failed: [EMAIL, SMS, PUSH]
      account-debited: [PUSH]
    email:
      from: noreply@fintrack.io
      templates-path: classpath:/templates/email/
    sms:
      provider: ${SMS_PROVIDER:mock}   # mock | twilio
      twilio:
        account-sid: ${TWILIO_SID:}
        auth-token: ${TWILIO_TOKEN:}
        from-number: ${TWILIO_FROM:+10000000000}
    push:
      provider: ${PUSH_PROVIDER:mock}  # mock | fcm
      fcm-key: ${FCM_KEY:}
    slack:
      webhook-url: ${SLACK_WEBHOOK:}
