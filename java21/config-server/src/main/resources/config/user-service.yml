server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      idle-timeout: 60000
      pool-name: UsersHikariPool
      initialization-fail-timeout: 120000
      connection-timeout: 30000
      connection-init-sql: SELECT 1
      keepalive-time: 60000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        boot:
          allow_jdbc_metadata_access: false
        jakarta:
          persistence:
            schema-generation:
              database:
                action: none
        # L1 cache is enabled per Session by default — nothing to configure
        cache.use_second_level_cache: false
        cache.use_query_cache: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 20
    connect-retries-interval: 5

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 20s

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  kafka:
    producer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.user.event.UserRegisteredEvent"
    consumer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.user.event.UserRegisteredEvent"

fintrack:
  user:
    password-encoder-strength: 12
    cache:
      users-by-id: users:byId
      users-by-email: users:byEmail
      ttl-seconds: 600
