server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      idle-timeout: 60000
      pool-name: UsersHikariPool
      initialization-fail-timeout: 120000
      connection-timeout: 30000
      connection-init-sql: SELECT 1
      keepalive-time: 60000
      max-lifetime: 1800000


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jakarta:
          persistence:
            schema-generation:
              database:
                action: none
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        # ── Hibernate L2 cache via JCache (EHCache) ────────────────────────
        cache.use_second_level_cache: true
        cache.use_query_cache: true
        cache.region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        javax.cache.provider: org.ehcache.jsr107.EhcacheCachingProvider
        javax.cache.uri: classpath:ehcache.xml
        generate_statistics: true
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 20
    connect-retries-interval: 5

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}


  cache:
    type: redis
    redis:
      time-to-live: 300000

  kafka:
    producer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.account.event.UserRegisteredEvent,accountCreatedEvent:com.fintrack.account.event.AccountCreatedEvent,accountDebitedEvent:com.fintrack.account.event.AccountDebitedEvent,transactionInitiatedEvent:com.fintrack.account.event.TransactionInitiatedEvent,transactionFailedEvent:com.fintrack.account.event.TransactionFailedEvent"
    consumer:
      properties:
        spring.json.type.mapping: "userRegisteredEvent:com.fintrack.account.event.UserRegisteredEvent,accountCreatedEvent:com.fintrack.account.event.AccountCreatedEvent,accountDebitedEvent:com.fintrack.account.event.AccountDebitedEvent,transactionInitiatedEvent:com.fintrack.account.event.TransactionInitiatedEvent,transactionFailedEvent:com.fintrack.account.event.TransactionFailedEvent"

fintrack:
  account:
    default-currency: USD
    interest:
      strategy: ${ACCOUNT_INTEREST_STRATEGY:tiered}   # flat | tiered | compound  (Strategy pattern)
      flat-rate: 0.01
      tiered:
        - { min: 0,      max: 1000,    rate: 0.005 }
        - { min: 1000,   max: 10000,   rate: 0.015 }
        - { min: 10000,  max: 100000,  rate: 0.025 }
        - { min: 100000, max: 9.9E18,  rate: 0.04  }
    cache:
      account-by-id: accounts:byId
      account-by-user: accounts:byUser
      ttl-seconds: 300

resilience4j:
  circuitbreaker:
    instances:
      userServiceClient:
        base-config: default
  retry:
    instances:
      userServiceClient:
        base-config: default
