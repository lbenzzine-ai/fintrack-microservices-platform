server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ACCOUNTS_HOST:localhost}:${MYSQL_ACCOUNTS_PORT:3308}/fintrack_accounts?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_ACCOUNTS_USER}
    password: ${MYSQL_ACCOUNTS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      pool-name: AccountsHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        # ── Hibernate L2 cache via JCache (EHCache) ────────────────────────
        cache.use_second_level_cache: true
        cache.use_query_cache: true
        cache.region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        javax.cache.provider: org.ehcache.jsr107.EhcacheCachingProvider
        javax.cache.uri: classpath:ehcache.xml
        generate_statistics: true
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000

fintrack:
  account:
    default-currency: USD
    interest:
      strategy: ${ACCOUNT_INTEREST_STRATEGY:tiered}   # flat | tiered | compound  (Strategy pattern)
      flat-rate: 0.01
      tiered:
        - { min: 0,      max: 1000,    rate: 0.005 }
        - { min: 1000,   max: 10000,   rate: 0.015 }
        - { min: 10000,  max: 100000,  rate: 0.025 }
        - { min: 100000, max: 9.9E18,  rate: 0.04  }
    cache:
      account-by-id: accounts:byId
      account-by-user: accounts:byUser
      ttl-seconds: 300

resilience4j:
  circuitbreaker:
    instances:
      userServiceClient:
        base-config: default
  retry:
    instances:
      userServiceClient:
        base-config: default
